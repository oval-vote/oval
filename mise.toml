# Tool versions and tasks for working on this repo. Install with `mise install`.
[tools]
rust = "1.99"

# Formatting. `format` runs every format:* task.
[tasks."format:mise"]
description = "Format mise.toml"
run = "mise fmt"

[tasks."format:rust"]
description = "Format the Rust code"
run = "cargo fmt --all"

[tasks."format:oval"]
description = "Format the example guides"
run = "cargo run -q -p oval-cli -- fmt examples/*.oval"

[tasks.format]
description = "Format everything"
depends = ["format:*"]

# Linting. `lint` runs every lint:* task.
[tasks."lint:rust"]
description = "Clippy with warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:oval"]
description = "The guide lint rules on the example guides"
run = "cargo run -q -p oval-cli -- lint examples/*.oval"

[tasks.lint]
description = "Lint everything"
depends = ["lint:*"]

[tasks.test]
description = "Unit tests, the conformance suite, and formatter checks"
run = "cargo test --workspace"

[tasks.check]
description = "Everything CI runs: formatting is clean, lints pass, tests pass"
depends = ["lint", "test"]
run = [
  "mise fmt --check",
  "cargo fmt --all --check",
  "cargo run -q -p oval-cli -- fmt --check examples/*.oval",
]

[tasks.hooks]
description = "Point git at the repo's pre-commit hook"
run = "git config core.hooksPath .githooks"
