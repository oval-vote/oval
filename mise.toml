# Tool versions for working on this repo. Install with `mise install`.
[tools]
rust = "1.97"

[tasks.format]
description = "Format the Rust code and the example guides"
run = ["cargo fmt --all", "cargo run -q -p oval-cli -- fmt examples/*.oval"]

[tasks.lint]
description = "Clippy with warnings denied, plus the lint rules on the example guides"
run = ["cargo clippy --workspace --all-targets -- -D warnings", "cargo run -q -p oval-cli -- lint examples/*.oval"]

[tasks.test]
description = "Run unit tests, the conformance suite, and formatter checks"
run = "cargo test --workspace"

[tasks.check]
description = "Everything CI runs: formatting, clippy, tests, example guides"
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets -- -D warnings", "cargo test --workspace", "cargo run -q -p oval-cli -- fmt --check examples/*.oval"]

[tasks.hooks]
description = "Point git at the repo's pre-commit hook"
run = "git config core.hooksPath .githooks"
