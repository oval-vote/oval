# Virtual workspace. Every crate lives under crates/ and inherits the settings below
# with `edition.workspace = true`, `lints.workspace = true`, and so on.

[workspace]
resolver = "3"
# Empty until the first crate lands; cargo rejects a glob that matches nothing.
# The first crate's PR changes this to ["crates/*"].
members = []

[workspace.package]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/oval-vote/oval"
homepage = "https://oval.vote"
authors = ["Varun Santhanam"]
publish = false

[workspace.dependencies]
# Shared dependency versions go here as crates are added.

[workspace.lints.rust]
# Hard-line safety and hygiene rules. Everything here is an error.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Start strict; relax individual lints with a comment explaining why.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight idiomatic code in a parser:
module_name_repetitions = "allow"   # oval_syntax::syntax_kind::SyntaxKind is fine
must_use_candidate = "allow"        # too noisy for builder-style APIs
missing_errors_doc = "allow"        # error types are documented at the type, not every fn
