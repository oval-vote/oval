[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/oval-vote/oval"
rust-version = "1.85"

[workspace.dependencies]
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
insta = { version = "1", features = ["json"] }
clap = { version = "4", features = ["derive"] }
