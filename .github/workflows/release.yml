name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/oval
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json is $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          crate="$(cargo pkgid -p oval-syntax | sed 's/.*#//')"
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "the workspace is $crate but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm publish
